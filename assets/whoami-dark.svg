<svg xmlns="http://www.w3.org/2000/svg" width="850" height="400" viewBox="0 0 850 400" fill="none" role="img" aria-label="whoami — Jose Gabriel Vilchez terminal">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c0c13"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6bff"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="849" height="399" rx="14" fill="url(#win)" stroke="#1c1c22"/>

  <!-- title bar -->
  <path d="M0 14 Q0 0.5 14 0.5 H836 Q850 0.5 850 14 V38 H0 Z" fill="#101018"/>
  <line x1="0" y1="38" x2="850" y2="38" stroke="#1c1c22"/>
  <circle cx="24" cy="19" r="5" fill="#6e6bff"/>
  <circle cx="42" cy="19" r="5" fill="#a78bfa"/>
  <circle cx="60" cy="19" r="5" fill="#ff8a4c"/>
  <text x="425" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#52525b">jgvilchezc — zsh</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" xml:space="preserve">
    <!-- whoami -->
    <text x="24" y="70"><tspan fill="#6e6bff" font-weight="700">$</tspan><tspan fill="#fafafa"> whoami</tspan></text>
    <text x="24" y="91"><tspan fill="#3f3f46">&gt; </tspan><tspan fill="#e4e4e7">josé gabriel vilchez</tspan><tspan fill="#3f3f46">  ::  </tspan><tspan fill="#a1a1aa">AI engineer · fullstack operator · sa-east-1</tspan></text>

    <!-- uptime -->
    <text x="24" y="128"><tspan fill="#6e6bff" font-weight="700">$</tspan><tspan fill="#fafafa"> uptime</tspan></text>
    <text x="24" y="149"><tspan fill="#3f3f46">&gt; </tspan><tspan fill="#a1a1aa">3+ yrs shipping production AI </tspan><tspan fill="#3f3f46">—</tspan><tspan fill="#a1a1aa"> RAG, agents, payment infrastructure</tspan></text>

    <!-- ls -->
    <text x="24" y="186"><tspan fill="#6e6bff" font-weight="700">$</tspan><tspan fill="#fafafa"> ls ./currently_shipping</tspan></text>
    <text x="24" y="207"><tspan fill="#a5a2ff">  ExpandCast/</tspan><tspan fill="#3f3f46">      # podcast → blog · threads · clips</tspan></text>
    <text x="24" y="228"><tspan fill="#a5a2ff">  ProductReel/</tspan><tspan fill="#3f3f46">     # Shopify URL → 36s video in </tspan><tspan fill="#ff8a4c">&lt;60s</tspan></text>
    <text x="24" y="249"><tspan fill="#a5a2ff">  AgroAsistente/</tspan><tspan fill="#3f3f46">   # agronomy chat for VE farmers</tspan></text>
    <text x="700" y="207" fill="#34d399">+ live</text>
    <text x="700" y="228" fill="#34d399">+ prod</text>
    <text x="700" y="249" fill="#34d399">+ PWA</text>

    <!-- note -->
    <text x="24" y="286"><tspan fill="#6e6bff" font-weight="700">$</tspan><tspan fill="#fafafa"> cat note.txt</tspan></text>
    <text x="24" y="307"><tspan fill="#3f3f46">&gt; </tspan><tspan fill="#71717a">most work lives in private repos under NDA — the public slice understates volume.</tspan></text>

    <!-- status -->
    <text x="24" y="344"><tspan fill="#6e6bff" font-weight="700">$</tspan><tspan fill="#fafafa"> status</tspan></text>
  </g>

  <text x="24" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#3f3f46">&gt;</text>
  <rect x="44" y="366" width="150" height="10" rx="5" fill="#1c1c22"/>
  <rect x="44" y="366" width="122" height="10" rx="5" fill="url(#bar)"/>
  <text x="206" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#34d399">open</tspan><tspan fill="#a1a1aa"> to senior IC roles </tspan><tspan fill="#3f3f46">&amp;</tspan><tspan fill="#a1a1aa"> select contracts</tspan></text>
</svg>
