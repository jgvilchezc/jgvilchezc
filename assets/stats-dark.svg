<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" fill="none" role="img" aria-label="GitHub stats">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c0c13"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="419" height="199" rx="12" fill="url(#win)" stroke="#1c1c22"/>

  <text x="20" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" xml:space="preserve"><tspan fill="#6e6bff">▸</tspan><tspan fill="#e4e4e7" font-weight="700"> stats</tspan></text>
  <text x="400" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#52525b">last 12 months</text>
  <line x1="20" y1="44" x2="400" y2="44" stroke="#1f1f25"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="20" y="72" fill="#a1a1aa">pull requests</text>
    <text x="400" y="72" text-anchor="end" fill="#fafafa" font-weight="700">118</text>

    <text x="20" y="98" fill="#a1a1aa">repositories</text>
    <text x="400" y="98" text-anchor="end" fill="#fafafa" font-weight="700">15</text>

    <text x="20" y="124" fill="#a1a1aa">commits · public · 12mo</text>
    <text x="400" y="124" text-anchor="end" fill="#fafafa" font-weight="700">185</text>

    <text x="20" y="150" fill="#a1a1aa">private work · 12mo</text>
    <text x="400" y="150" text-anchor="end" fill="#ff8a4c" font-weight="700">1,172</text>

    <text x="20" y="176" fill="#a1a1aa">primary language</text>
    <text x="400" y="176" text-anchor="end" fill="#a5a2ff" font-weight="700">TypeScript</text>
  </g>
</svg>
