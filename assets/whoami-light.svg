<svg xmlns="http://www.w3.org/2000/svg" width="850" height="400" viewBox="0 0 850 400" fill="none" role="img" aria-label="whoami — Jose Gabriel Vilchez terminal">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e2bfa"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="849" height="399" rx="14" fill="url(#win)" stroke="#e4e4e7"/>

  <path d="M0 14 Q0 0.5 14 0.5 H836 Q850 0.5 850 14 V38 H0 Z" fill="#f4f4f5"/>
  <line x1="0" y1="38" x2="850" y2="38" stroke="#e4e4e7"/>
  <circle cx="24" cy="19" r="5" fill="#2e2bfa"/>
  <circle cx="42" cy="19" r="5" fill="#8b5cf6"/>
  <circle cx="60" cy="19" r="5" fill="#f97316"/>
  <text x="425" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a1a1aa">jgvilchezc — zsh</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" xml:space="preserve">
    <text x="24" y="70"><tspan fill="#2e2bfa" font-weight="700">$</tspan><tspan fill="#18181b"> whoami</tspan></text>
    <text x="24" y="91"><tspan fill="#a1a1aa">&gt; </tspan><tspan fill="#27272a">josé gabriel vilchez</tspan><tspan fill="#d4d4d8">  ::  </tspan><tspan fill="#52525b">AI engineer · fullstack operator · sa-east-1</tspan></text>

    <text x="24" y="128"><tspan fill="#2e2bfa" font-weight="700">$</tspan><tspan fill="#18181b"> uptime</tspan></text>
    <text x="24" y="149"><tspan fill="#a1a1aa">&gt; </tspan><tspan fill="#52525b">3+ yrs shipping production AI </tspan><tspan fill="#d4d4d8">—</tspan><tspan fill="#52525b"> RAG, agents, payment infrastructure</tspan></text>

    <text x="24" y="186"><tspan fill="#2e2bfa" font-weight="700">$</tspan><tspan fill="#18181b"> ls ./currently_shipping</tspan></text>
    <text x="24" y="207"><tspan fill="#4f46e5">  ExpandCast/</tspan><tspan fill="#a1a1aa">      # podcast → blog · threads · clips</tspan></text>
    <text x="24" y="228"><tspan fill="#4f46e5">  ProductReel/</tspan><tspan fill="#a1a1aa">     # Shopify URL → 36s video in </tspan><tspan fill="#ea580c">&lt;60s</tspan></text>
    <text x="24" y="249"><tspan fill="#4f46e5">  AgroAsistente/</tspan><tspan fill="#a1a1aa">   # agronomy chat for VE farmers</tspan></text>
    <text x="700" y="207" fill="#059669">+ live</text>
    <text x="700" y="228" fill="#059669">+ prod</text>
    <text x="700" y="249" fill="#059669">+ PWA</text>

    <text x="24" y="286"><tspan fill="#2e2bfa" font-weight="700">$</tspan><tspan fill="#18181b"> cat note.txt</tspan></text>
    <text x="24" y="307"><tspan fill="#a1a1aa">&gt; </tspan><tspan fill="#71717a">most work lives in private repos under NDA — the public slice understates volume.</tspan></text>

    <text x="24" y="344"><tspan fill="#2e2bfa" font-weight="700">$</tspan><tspan fill="#18181b"> status</tspan></text>
  </g>

  <text x="24" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#a1a1aa">&gt;</text>
  <rect x="44" y="366" width="150" height="10" rx="5" fill="#e4e4e7"/>
  <rect x="44" y="366" width="122" height="10" rx="5" fill="url(#bar)"/>
  <text x="206" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#059669">open</tspan><tspan fill="#52525b"> to senior IC roles </tspan><tspan fill="#d4d4d8">&amp;</tspan><tspan fill="#52525b"> select contracts</tspan></text>
</svg>
