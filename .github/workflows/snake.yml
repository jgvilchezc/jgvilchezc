name: generate contribution snake

on:
  schedule:
    # rebuild once a day
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=2e2bfa&color_dots=fafafa,c4c4cc,8a8a93,2e2bfa,2e2bfa
            dist/github-snake-dark.svg?palette=github-dark&color_snake=6e6bff&color_dots=141414,1f1f22,6e6bff,6e6bff,9d9bff

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
